<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Moodle Batch</title>
<link rel="stylesheet" href="dashboard.css"></head><body>
<header><h1>Moodle Batch</h1><p id="message">Подключаюсь к сервису…</p></header>
<section class="actions">
  <button id="refresh">Обновить анализ</button>
  <label><input id="low" type="checkbox"> Только ниже 90%</label>
  <button id="select">Выбрать показанные</button><button id="clear">Снять выбор</button>
  <label>Попыток до 100% <select id="rounds"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select></label>
  <button id="run" class="primary" disabled>Решить и отправить выбранные</button>
  <button id="stop" disabled>Остановить</button>
</section>
<p>Ответы отправляются в Moodle. Подтверждённые решения и ошибки сохраняются для следующих попыток.</p>
<section id="jobs" aria-live="polite"></section>
<section id="courses"></section>
<script src="dashboard.js"></script></body></html>
